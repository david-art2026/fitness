<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>硬核训练监控 (Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <style>
        body { background-color: #111827; color: #f9fafb; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .slide-fade-enter-active { transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .slide-fade-leave-active { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); position: absolute; width: 100%; top: 0; left: 0;}
        .slide-fade-enter-from { opacity: 0; transform: translateX(20px); }
        .slide-fade-leave-to { opacity: 0; transform: translateX(-20px); }
        .btn-press { transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-press:active { transform: scale(0.96); }
        input, select { outline: none; }
        
        .toast-enter-active, .toast-leave-active { transition: all 0.3s ease; }
        .toast-enter-from, .toast-leave-to { opacity: 0; transform: translateY(-20px); }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased">

<div id="app" class="min-h-screen relative pb-24 w-full max-w-md mx-auto border-x border-gray-800">
    
    <!-- 全局 Toast 提示 -->
    <transition name="toast">
        <div v-if="toast.show" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full shadow-lg text-sm font-medium backdrop-blur-md whitespace-nowrap"
             :class="toast.type === 'error' ? 'bg-red-500/90 text-white' : 'bg-blue-500/90 text-white'">
            {{ toast.message }}
        </div>
    </transition>

    <!-- 顶部状态栏 (新增实时时钟) -->
    <header class="pt-10 pb-4 px-6 sticky top-0 bg-gray-900/95 backdrop-blur-md z-10 border-b border-gray-800 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">{{ pageTitle }}</h1>
            <p class="text-gray-400 text-[10px] mt-1">基于 HRV 与 sRPE 的自适应模型</p>
        </div>
        <!-- 实时系统时钟 (离线运作) -->
        <div class="text-right flex flex-col items-end">
            <span class="text-lg font-mono font-bold text-gray-200 tracking-wider">{{ formattedTime }}</span>
            <span class="text-[9px] font-mono text-gray-500 mt-0.5">{{ formattedDate }}</span>
        </div>
    </header>

    <div class="px-6 mt-4 relative">
        <transition name="slide-fade">
            
            <!-- ================== 页面 1：状态与 1RM 基准 ================== -->
            <div v-if="activeTab === 'recovery'" key="recovery" class="w-full">
                
                <!-- 状态指示卡片 -->
                <div class="bg-gray-800 rounded-3xl p-6 shadow-lg mb-6 border border-gray-700 relative overflow-hidden transition-all duration-500">
                    <div class="absolute top-0 left-0 w-2 h-full transition-colors duration-500" :class="statusColor"></div>
                    <h2 class="text-gray-400 text-sm font-medium">中枢神经准备程度 (CNS)</h2>
                    <div class="mt-2 flex items-baseline gap-2">
                        <span class="text-4xl font-bold transition-colors duration-500" :class="statusTextColor">{{ recoveryScore }}</span>
                        <span class="text-gray-500 font-medium">/ 100</span>
                    </div>
                    <p class="text-sm mt-3" :class="statusTextColor">{{ statusMessage }}</p>
                </div>

                <!-- 冷启动基线设置 -->
                <div v-if="!hasBaseline" class="bg-blue-900/30 rounded-2xl p-4 border border-blue
